version: 2
# Version updates are off (open-pull-requests-limit: 0 on every job below):
# the weekly bump PRs piled up faster than they were worked, mostly red
# against the audit gate. Security updates are unaffected by this setting —
# they run from the repository's security settings — so advisories still
# open PRs when a fix exists. Two caveats: the groups below only ever
# applied to version updates, so a security bump to one cdk or tonic/prost
# family member arrives alone and may not build (the lockstep pins are the
# reason the groups exist) — finish those by hand, with the weekly audit
# cron as the loud backstop. And Docker has no security-update equivalent,
# so base-image bumps pause entirely while this is off. Delete the limit
# lines (or set them back to 5) to re-enable version updates.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      # `cdk` and the `cdk-*` crates all pin `cdk-common` to an exact version,
      # so they must bump together — a PR updating only one of them won't build.
      cdk:
        patterns:
          - "cdk"
          - "cdk-*"

  # grpc-server is a standalone crate (excluded from the root workspace).
  - package-ecosystem: cargo
    directory: /grpc-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      # The code tonic-build generates and the tonic-reflection service only
      # work with the matching tonic, and prost moves with them — bump as one
      # family so a PR never mixes two tonic versions.
      tonic:
        patterns:
          - "tonic*"
          - "prost*"

  # stress-test is also a standalone crate (excluded from the root workspace).
  - package-ecosystem: cargo
    directory: /stress-test
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7
    groups:
      # One PR for all action updates: every Actions PR fails the mirror sync
      # check by design (Dependabot never touches .ngit/act), so a group
      # means one PR and one manual sync per week instead of one per action.
      actions:
        patterns:
          - "*"

  # The final stage is FROM nginx:${NGX_VERSION} — Dependabot can't resolve
  # the variable, so only the rust builder image gets updates here. nginx is
  # pinned on purpose; its security fixes arrive via manual NGX_VERSION bumps,
  # not Dependabot.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  # grpc-server has its own Dockerfile (FROM rust:1.85).
  - package-ecosystem: docker
    directory: /grpc-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
