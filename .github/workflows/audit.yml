name: Security Audit

# Run only when the audit's inputs change: the workspace lockfile, the
# manifests, and this workflow itself (the --ignore flags live here). The
# weekly cron still catches advisories against an unchanged lockfile.
# stress-test/Cargo.lock is outside the workspace and never audited (known
# gap).
on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'ngx_l402_core/Cargo.toml'
      - '.github/workflows/audit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'ngx_l402_core/Cargo.toml'
      - '.github/workflows/audit.yml'
  schedule:
    # Re-run weekly so newly-disclosed advisories are caught even without a push.
    - cron: '0 6 * * 1'

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        # Audit the dependency tree against the RustSec advisory database.
        # `lightning 0.0.125` and `tonic 0.7` are known-outdated; once they are
        # upgraded, drop the corresponding --ignore flags so regressions fail CI.
        run: cargo audit
