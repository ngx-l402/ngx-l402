name: Security Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Re-run weekly so newly-disclosed advisories are caught even without a push.
    - cron: '0 6 * * 1'

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        # Audit the dependency tree against the RustSec advisory database.
        # The root scan covers the workspace lockfile only; stress-test is a
        # standalone crate with its own Cargo.lock, so it gets an explicit
        # scan of its own. (grpc-server builds lockless by design.)
        run: |
          cargo audit
          cargo audit --file stress-test/Cargo.lock
