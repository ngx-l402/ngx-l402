name: Deploy Documentation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Install mdbook-mermaid
        run: cargo install mdbook-mermaid

      - name: Install mermaid JS files
        run: mdbook-mermaid install .

      - name: Build documentation
        run: mdbook build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book

      # Keep ngx-l402.org/docs/ in sync: the website repo serves the built
      # book from its docs/ folder (works on GitHub Pages, Cloudflare, nsite).
      - name: Checkout website repo
        uses: actions/checkout@v7
        with:
          repository: ngx-l402/ngx-l402.org
          token: ${{ secrets.SITE_DEPLOY_KEY }}   # fine-grained PAT, Contents: read+write on the website repo
          path: site

      - name: Sync built docs to website repo
        run: |
          rm -rf site/docs
          cp -r book site/docs
          cd site
          git config user.name "docs-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "docs: sync built book from ngx-l402@${GITHUB_SHA::7}"
          git push
