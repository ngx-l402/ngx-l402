name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: The ngit CI mirrors must be in sync
        # Stage before diffing: `git diff` compares the worktree to the index and
        # cannot see an untracked path, so a mirror sync.sh newly emits for a
        # workflow nobody has committed a mirror for would pass green. `--cached`
        # asks "does the tree match the commit?", which is the question. Nothing
        # is committed -- the checkout is throwaway.
        run: |
          ./.ngit/act/sync.sh
          git add -A -- .ngit/act/workflows
          git diff --cached --exit-code -- .ngit/act/workflows && exit 0
          echo "::error::.ngit/act/workflows is stale"
          echo "fix with: ./.ngit/act/sync.sh && git add -A .ngit/act/workflows"
          exit 1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # tonic's build script shells out to protoc, and nginx-sys binds through
      # bindgen, which needs libclang. GitHub's runner image happens to carry
      # libclang; leaner ones (the act images ngit-ci runs on) do not, and the
      # failure there is a bindgen panic that reads like a code fault.
      - name: Install protoc and libclang
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # nginx-sys builds bindings from the nginx source tree, so clippy needs
      # it configured first. --with-compat matches the Dockerfile build and
      # covers the x_real_ip field that src/lib.rs reads (NGX_HTTP_REALIP is
      # defined by --with-compat; the two --without flags only keep runner
      # deps minimal and don't affect the binding surface for this code).
      - name: Download and configure nginx source
        run: |
          curl -fsSL https://nginx.org/download/nginx-1.28.0.tar.gz | tar xz
          cd nginx-1.28.0
          ./configure --with-compat \
            --without-http_rewrite_module --without-http_gzip_module

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
        env:
          NGINX_SOURCE_DIR: ${{ github.workspace }}/nginx-1.28.0
