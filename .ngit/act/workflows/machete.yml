name: Unused Dependencies

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  cargo-machete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked --version 0.9.2

      # One run covers the workspace plus the excluded standalone crates
      # (grpc-server, stress-test); no NGINX_SOURCE_DIR needed.
      - name: Run cargo machete
        run: cargo machete
