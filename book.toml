[book]
title = "ngx_l402 - L402 Nginx Module"
description = "Lightning Network-based authentication and monetization for Nginx"
authors = ["Dhananjay Purohit"]
language = "en"
src = "docs"

[output.html]
site-url = "/docs/"
git-repository-url = "https://github.com/ngx-l402/ngx-l402"
edit-url-template = "https://github.com/ngx-l402/ngx-l402/edit/main/docs/{path}"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[preprocessor.mermaid]
command = "mdbook-mermaid"
