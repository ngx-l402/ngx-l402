worker_processes  auto;
error_log  /var/log/nginx/error.log  info;
pid        /var/run/nginx.pid;

load_module /etc/nginx/modules/libngx_l402_lib.so;

events {
    worker_connections  1024;
}

http {
    server {
        listen 8000;

        location /mcp {
            l402                        on;
            l402_mcp                    on;
            # The MCP Python SDK rejects a request whose Mcp-Method / Mcp-Name
            # headers disagree with its body. Only declare this for an upstream
            # that does; nginx won't start l402_mcp without it.
            l402_mcp_upstream_validates on;

            l402_amount_msat_default    10000;   # 10 sats: any tool without its own line
            l402_mcp_tool  summarize    50000;   # 50 sats

            proxy_pass         http://mcp-server:8000;
            proxy_http_version 1.1;
            # Tool results can stream back as SSE.
            proxy_buffering    off;
        }
    }
}
