user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log debug;
pid        /var/run/nginx.pid;
# load module for l402
load_module /etc/nginx/modules/libngx_l402_lib.so;

events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log;
    
    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    #include /etc/nginx/conf.d/*.conf;

    # DNS resolver used to look up proxied/gRPC backends lazily at request time
    # instead of at startup. 127.0.0.11 is Docker's embedded DNS, available on
    # any user-defined Docker network (e.g. docker-compose). Standalone runs
    # never resolve the demo backend below, so an unreachable resolver here is
    # harmless — nginx only contacts it when the gRPC demo route is actually hit.
    resolver 127.0.0.11 ipv6=off valid=30s;

    server {
        # Enable HTTP/2 for gRPC support
        listen 8000;
        listen [::]:8000;
        http2 on;
        server_name _;

        # L402 protection for gRPC endpoints.
        #
        # This route proxies to `grpc-content-server`, a demo backend that only
        # exists inside this project's docker-compose stack. To keep the
        # published image generic and able to start standalone, the
        # backend is referenced through a variable so nginx defers DNS
        # resolution to request time. Without the variable, nginx resolves the
        # hostname at startup and the whole server fails to boot when the demo
        # backend is absent. Standalone, this route returns 502 (the rest of the
        # config still works); in docker-compose it resolves normally.
        location /content.ContentService/ {
            # l402 module directives:
            l402    on;
            l402_amount_msat_default    10000;
            l402_macaroon_timeout 0;  # Macaroon validity in seconds, set to 0 to disable timeout

            # Proxy directly to gRPC server without rewrite. Variable form =>
            # lazy, request-time resolution via the `resolver` defined above.
            set $grpc_content_backend grpc-content-server:50051;
            grpc_pass grpc://$grpc_content_backend;
        }

        location / {
            root    /usr/share/nginx/html;
            index   index.html index.htm;
        }

        location /protected {
            root   /usr/share/nginx/html;
            # l402 module directives:
            l402    on;
            l402_amount_msat_default    10000;
            # Note: Dynamic pricing is handled via Redis using the request path as key
            # Example: SET /protected 15000 (sets price to 15000 msats for /protected endpoint)
            l402_macaroon_timeout 0;  # Macaroon validity in seconds, set to 0 to disable timeout
            
            # Try exact URI first, then directory index, avoid auto-redirect
            try_files $uri $uri/index.html =404;
        }

        # Structured JSON logging endpoint: same as /protected but with
        # l402_log_format json, so CI can assert the l402_* JSON events land
        # in the container logs. A 1r/m invoice rate limit lets the same CI
        # section cover the l402_rate_limited event. /protected stays on text
        # logging so the same CI run also proves the default is unchanged.
        location /json-logs {
            root   /usr/share/nginx/html;
            l402    on;
            l402_amount_msat_default    10000;
            l402_macaroon_timeout 0;
            l402_log_format json;
            l402_invoice_rate_limit 1r/m;

            try_files $uri $uri/index.html =404;
        }

        location /protected-timeout {
            root   /usr/share/nginx/html;
            # l402 module directives:
            l402    on;
            l402_amount_msat_default    10000;
            l402_macaroon_timeout 15;  # Macaroon validity in seconds, set to 0 to disable timeout
            
            # Try exact URI first, then directory index, avoid auto-redirect
            try_files $uri $uri/index.html =404;
        }

        # Indefinite-access endpoint: a single payment grants access for the
        # lifetime of the macaroon. The same preimage can be reused repeatedly.
        location /protected-indefinite {
            root   /usr/share/nginx/html;
            l402    on;
            l402_amount_msat_default    10000;
            l402_macaroon_timeout 60;
            l402_indefinite_access on;

            try_files $uri $uri/index.html =404;
        }

        # Realm-scoped endpoints: pay once, open both paths.
        #
        # Normally a macaroon opens only the exact path it was minted for, so a
        # token bought at /realm-a would be rejected at /realm-b. l402_realm
        # swaps that for a shared name — any location naming "demo-realm"
        # accepts the token.
        #
        # l402_indefinite_access must be on: the client sends the same preimage
        # to every path, and the replay check would treat the second one as
        # reuse. Without it the token opens one path and nothing else.
        location /realm-a {
            root   /usr/share/nginx/html;
            l402    on;
            l402_amount_msat_default    10000;
            l402_macaroon_timeout 300;
            l402_realm "demo-realm";
            l402_indefinite_access on;

            try_files $uri $uri/index.html =404;
        }

        location /realm-b {
            root   /usr/share/nginx/html;
            l402    on;
            l402_amount_msat_default    10000;
            l402_macaroon_timeout 300;
            l402_realm "demo-realm";
            l402_indefinite_access on;

            try_files $uri $uri/index.html =404;
        }

        # Shadow-mode endpoint: L402 is evaluated (pricing, challenge
        # generation, structured logs, Prometheus counters) but payment is
        # NOT enforced. All requests return 200 OK regardless of the
        # Authorization header. Use this for safe production rollouts.
        location /shadow {
            root   /usr/share/nginx/html;
            l402    on;
            l402_amount_msat_default    10000;
            l402_macaroon_timeout 0;
            l402_dry_run on;

            try_files $uri $uri/index.html =404;
        }

        # Prometheus scrape endpoint. Emits `l402_*` and `l402_dry_run_*`
        # counters in text exposition format (v0.0.4).
        #
        # Prometheus metrics. Closed by default: the counters expose invoice
        # volume, payment/error rates and revenue signals, and this file ships
        # in the Docker image — an open default would publish that for every
        # deployment that never edited it.
        #
        # Widen `allow` to your Prometheus host or monitoring subnet, e.g.
        #     allow 10.0.0.0/8;
        # Scraping from another container? Allow that network rather than
        # removing `deny all`.
        location = /metrics {
            allow 127.0.0.1;
            allow ::1;
            deny  all;
            l402_metrics;
        }

        # Capability manifest. Lets agents (and humans) discover this
        # instance's paid routes, prices, and accepted payment backends
        # via a single JSON document — the agent-era robots.txt.
        location = /.well-known/l402-services {
            l402_manifest;
        }

        # Rate-limited endpoint: only 2 invoices per minute per IP.
        # Used by the invoice rate limiting integration tests.
        location /rate-limited {
            root   /usr/share/nginx/html;
            l402    on;
            l402_amount_msat_default    10000;
            l402_macaroon_timeout 0;
            l402_invoice_rate_limit 2r/m;

            try_files $uri $uri/index.html =404;
        }

        # Auto-detect payment endpoint for integration tests.
        # Enables server-side invoice settlement lookup (no client preimage needed).
        # Supported backends: LND, CLN, Eclair.
        location /protected-auto {
            root   /usr/share/nginx/html;
            l402    on;
            l402_amount_msat_default    10000;
            l402_macaroon_timeout 0;
            l402_auto_detect_payment on;

            try_files  /index.html =404;
        }

        # Multi-tenant LNURL endpoints for testing
        location /tenant1 {
            root   /usr/share/nginx/html;
            # l402 module directives for tenant 1:
            l402    on;
            l402_amount_msat_default    10000;
            l402_macaroon_timeout 0;
            l402_lnurl_addr "hello@getalby.com";  # Tenant 1's LNURL address (external)
            
            # Try exact URI first, then directory index, avoid auto-redirect
            try_files $uri $uri/index.html =404;
        }

        location /tenant2 {
            root   /usr/share/nginx/html;
            # l402 module directives for tenant 2:
            l402    on;
            l402_amount_msat_default    10000;
            l402_macaroon_timeout 0;
            l402_lnurl_addr "test@walletofsatoshi.com";  # Tenant 2's LNURL address (external)
            
            # Try exact URI first, then directory index, avoid auto-redirect
            try_files $uri $uri/index.html =404;
        }
    }
}